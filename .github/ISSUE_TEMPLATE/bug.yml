name: Bug report
description: Something does not work in Hypoland
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Hypoland is a fork of Hyprland for GPUs limited to OpenGL ES 2.0. Please report bugs of Hypoland here,
        not to Hyprland.
  - type: textarea
    id: version
    attributes:
      label: Version
      description: The output of `hyprctl version` (or `Hypoland --version` if it does not start).
      render: text
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and drivers
      description: GPU, driver and Mesa version, e.g. the output of `eglinfo -B` and `lspci -nn | grep -i vga`.
      render: text
    validations:
      required: true
  - type: textarea
    id: bug
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The steps that lead to the bug. Does it also happen with stock Hyprland on other hardware?
  - type: textarea
    id: logs
    attributes:
      label: Logs and crash reports
      description: |
        The log is in `$XDG_RUNTIME_DIR/hypr/<instance>/hyprland.log`, crash reports are in `~/.cache/hyprland/`.
      render: text
