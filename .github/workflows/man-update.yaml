name: Build man pages

on:
  workflow_dispatch:
  push:
    paths:
      - docs/**
    branches:
      - 'master'

permissions:
  contents: write

jobs:
  main:
    name: Build man pages
    runs-on: ubuntu-latest
    steps:
    - name: Install deps
      run: sudo apt install pandoc

    - name: Clone repository
      uses: actions/checkout@v6

    - name: Build man pages
      run: make man

    - uses: stefanzweifel/git-auto-commit-action@v7
      name: Commit
      with:
        commit_message: "[gha] build man pages"
